services:
  tuya-mqtt:
    image: tuya-mqtt:local
    build: .
    init: true
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TUYA_MQTT_WEB_PORT:-3200}:3200"
    volumes:
      - tuya-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  tuya-data:
